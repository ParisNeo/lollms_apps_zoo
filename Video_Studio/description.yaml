description: >-
  A Lollms web app that transforms structured HTML video-source files into
  narrated, animated explainer videos with synchronized audio. Upload an HTML
  file containing canvas animations and a NARRATION array, synthesize TTS audio
  via the Lollms backend, and record the canvas + audio together as a .webm
  file with real, seekable audio. No tab sharing. No silent failure.
