<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onto — Ontology Editor</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<style>
:root {
  --bg0:#0b0d12;--bg1:#111318;--bg2:#181b23;--bg3:#1f222d;--bg4:#272b38;
  --ln:#252934;--ln2:#343848;--ln3:#424760;
  --t0:#e2e5f0;--t1:#a0a8bf;--t2:#5e6680;--t3:#3a3f55;
  --acc:#7c6ff7;--acc2:#5d56d4;--acc-bg:rgba(124,111,247,.15);
  --grn:#4ade80;--grn-bg:rgba(74,222,128,.1);
  --amb:#fbbf24;--amb-bg:rgba(251,191,36,.1);
  --red:#f87171;--red-bg:rgba(248,113,113,.1);
  --tel:#2dd4bf;--tel-bg:rgba(45,212,191,.1);
  --pnk:#f472b6;--pnk-bg:rgba(244,114,182,.1);
  --sky:#38bdf8;--sky-bg:rgba(56,189,248,.1);
  --r:6px;--r2:10px;
  --font:'DM Sans',sans-serif;--mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg0);color:var(--t0);font-family:var(--font);font-size:13px}
#app{display:grid;grid-template-rows:46px 1fr;grid-template-columns:256px 1fr 308px;height:100vh}

/* topbar */
#tb{grid-column:1/-1;background:var(--bg1);border-bottom:1px solid var(--ln);display:flex;align-items:center;padding:0 12px;gap:2px}
.logo{font-size:16px;font-weight:700;letter-spacing:-.5px;margin-right:10px;display:flex;align-items:center;gap:6px}
.logo .hex{color:var(--acc)}
.tsep{width:1px;height:22px;background:var(--ln);margin:0 6px;flex-shrink:0}
.tbtn{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:var(--r);border:1px solid transparent;background:transparent;color:var(--t1);font-family:var(--font);font-size:12px;cursor:pointer;transition:all .12s;white-space:nowrap}
.tbtn:hover{background:var(--bg3);color:var(--t0)}
.tbtn svg{width:13px;height:13px;flex-shrink:0}
.tbtn .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tsp{flex:1}
.iri-pill{font-family:var(--mono);font-size:10px;color:var(--t2);background:var(--bg2);border:1px solid var(--ln);border-radius:var(--r);padding:3px 8px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.iri-pill:hover{border-color:var(--ln2);color:var(--t1)}

/* left sidebar */
#sl{border-right:1px solid var(--ln);background:var(--bg1);display:flex;flex-direction:column;overflow:hidden}
.sh{padding:10px 14px 8px;border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.stitle{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t2)}
.sb{flex:1;overflow-y:auto;padding:4px 0}
.sb::-webkit-scrollbar{width:3px}
.sb::-webkit-scrollbar-thumb{background:var(--ln2);border-radius:2px}
.sec-head{padding:6px 14px 3px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);display:flex;align-items:center;justify-content:space-between}
.ti{display:flex;align-items:center;gap:7px;padding:3px 14px 3px 12px;cursor:pointer;border-left:2px solid transparent;transition:all .1s;color:var(--t1)}
.ti:hover{background:var(--bg2);color:var(--t0)}
.ti.sel{background:var(--acc-bg);color:var(--acc);border-left-color:var(--acc)}
.ti .tlbl{font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti .tbadge{font-size:9px;padding:1px 5px;border-radius:3px;background:var(--bg3);color:var(--t2);flex-shrink:0;font-family:var(--mono)}
.ab{width:16px;height:16px;border-radius:3px;border:1px solid var(--ln2);background:transparent;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;transition:all .12s}
.ab:hover{background:var(--bg3);color:var(--t0);border-color:var(--acc)}
.statsbar{display:flex;border-top:1px solid var(--ln);flex-shrink:0}
.si{flex:1;padding:8px 4px;text-align:center;border-right:1px solid var(--ln)}
.si:last-child{border-right:none}
.sv{font-size:15px;font-weight:600}
.sl2{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--t2);margin-top:1px}

/* canvas */
#ca{position:relative;background:var(--bg0)}
#cy{width:100%;height:100%}

/* right sidebar */
#sr{border-left:1px solid var(--ln);background:var(--bg1);display:flex;flex-direction:column;overflow:hidden}
.itabs{display:flex;border-bottom:1px solid var(--ln);flex-shrink:0}
.itab{flex:1;padding:10px 4px;text-align:center;font-size:11px;color:var(--t2);cursor:pointer;border-bottom:2px solid transparent;transition:all .12s}
.itab:hover{color:var(--t0)}
.itab.active{color:var(--acc);border-bottom-color:var(--acc)}
.ib{flex:1;overflow-y:auto;padding:0}
.ib::-webkit-scrollbar{width:3px}
.ib::-webkit-scrollbar-thumb{background:var(--ln2);border-radius:2px}
.is{padding:10px 14px;border-bottom:1px solid var(--ln)}
.is:last-child{border-bottom:none}
.fl{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t2);margin-bottom:5px}
.fi{width:100%;background:var(--bg2);border:1px solid var(--ln);border-radius:var(--r);padding:6px 9px;color:var(--t0);font-family:var(--font);font-size:12px;transition:border-color .12s;outline:none}
.fi:focus{border-color:var(--acc)}
.fi.mono{font-family:var(--mono);font-size:10px}
.fi-sm{font-size:11px;padding:4px 8px}
textarea.fi{resize:vertical;min-height:54px}

/* shape selector */
.shape-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:4px}
.shape-opt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:var(--r);border:1px solid var(--ln);cursor:pointer;transition:all .12s;color:var(--t2);font-size:9px;text-align:center}
.shape-opt:hover{border-color:var(--ln2);color:var(--t1);background:var(--bg2)}
.shape-opt.active{border-color:var(--acc);color:var(--acc);background:var(--acc-bg)}
.shape-opt svg{width:22px;height:22px}

/* color picker row */
.color-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.co{width:20px;height:20px;border-radius:4px;cursor:pointer;border:2px solid transparent;transition:all .12s;flex-shrink:0}
.co.active{border-color:#fff;transform:scale(1.15)}

/* code panel */
#cp{position:absolute;bottom:0;left:0;right:0;height:270px;background:var(--bg1);border-top:1px solid var(--ln);display:flex;flex-direction:column;z-index:10;transform:translateY(100%);transition:transform .2s ease}
#cp.open{transform:translateY(0)}
#cp-head{padding:7px 14px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:6px;flex-shrink:0}
.ctab{padding:3px 10px;border-radius:4px;font-size:11px;cursor:pointer;color:var(--t2);transition:all .12s}
.ctab.active{background:var(--acc-bg);color:var(--acc)}
#cp-ta{flex:1;background:transparent;border:none;outline:none;padding:10px 14px;font-family:var(--mono);font-size:11px;color:var(--t0);resize:none;line-height:1.75;tab-size:2}

/* HUD */
.hud{position:absolute;display:flex;gap:4px}
.hud-tl{top:12px;left:12px}
.hud-tr{top:12px;right:12px}
.hud-bl{bottom:12px;left:12px}
.hb{width:30px;height:30px;border-radius:var(--r);background:var(--bg2);border:1px solid var(--ln);color:var(--t1);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0}
.hb:hover{background:var(--bg3);color:var(--t0);border-color:var(--ln2)}
.hb svg{width:14px;height:14px}
.hb.active{background:var(--acc-bg);color:var(--acc);border-color:var(--acc)}
#selbar{display:none;background:var(--bg2);border:1px solid var(--ln);border-radius:var(--r);padding:4px 10px;font-size:11px;color:var(--t1);gap:8px;align-items:center}

/* modal */
#mo{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center}
#mo.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--ln2);border-radius:var(--r2);padding:22px;width:460px;max-width:95vw;max-height:85vh;overflow-y:auto}
.modal h2{font-size:14px;font-weight:600;margin-bottom:16px}
.mrow{margin-bottom:13px}
.mrow label{display:block;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t2);margin-bottom:4px}
.mrow select{width:100%;background:var(--bg3);border:1px solid var(--ln);border-radius:var(--r);padding:6px 9px;color:var(--t0);font-family:var(--font);font-size:12px;outline:none}
.mrow select:focus{border-color:var(--acc)}
.macts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.btn{padding:6px 14px;border-radius:var(--r);font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;transition:all .12s;border:1px solid transparent}
.btn-p{background:var(--acc);color:#fff}
.btn-p:hover{background:var(--acc2)}
.btn-g{background:transparent;color:var(--t1);border-color:var(--ln2)}
.btn-g:hover{background:var(--bg3);color:var(--t0)}
.btn-d{background:var(--red-bg);color:var(--red);border-color:rgba(248,113,113,.2)}
.btn-d:hover{background:rgba(248,113,113,.18)}

/* misc */
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:3px;font-size:10px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;color:var(--t2);text-align:center;padding:24px}
.empty svg{width:40px;height:40px;opacity:.25}
.empty p{font-size:11px;line-height:1.6;max-width:180px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(50px);background:var(--bg4);border:1px solid var(--ln2);border-radius:var(--r2);padding:7px 14px;font-size:12px;z-index:300;transition:transform .2s;pointer-events:none;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0)}

.sparql-row:hover{background:var(--bg4) !important}
</style>
</head>
<body>
<div id="app">

<!-- TOPBAR -->
<div id="tb">
  <div class="logo"><span class="hex">⬡</span> Onto</div>
  <div class="tsep"></div>
  <button class="tbtn" onclick="openModal('class')"><div class="dot" style="background:var(--acc)"></div>Class</button>
  <button class="tbtn" onclick="openModal('property')"><div class="dot" style="background:var(--tel)"></div>Obj. Property</button>
  <button class="tbtn" onclick="openModal('dataprop')"><div class="dot" style="background:var(--amb)"></div>Data Property</button>
  <button class="tbtn" onclick="openModal('individual')"><div class="dot" style="background:var(--grn)"></div>Individual</button>
  <button class="tbtn" onclick="openModal('annprop')"><div class="dot" style="background:var(--pnk)"></div>Ann. Property</button>
  <div class="tsep"></div>
  <button class="tbtn" onclick="openRelModal()">
    <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="3" cy="7" r="2"/><circle cx="11" cy="7" r="2"/><line x1="5" y1="7" x2="9" y2="7"/></svg>
    Relation
  </button>
  <div class="tsep"></div>
  <button class="tbtn" onclick="runLayout()">
    <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 2h4v4H2zM8 2h4v4H8zM2 8h4v4H2zM8 8h4v4H8z"/></svg>
    Layout
  </button>
  <div class="tsp"></div>
  <div class="iri-pill" id="iri-disp" onclick="setIRI()" title="Click to change IRI">http://example.org/onto#</div>
  <div class="tsep"></div>
  <button class="tbtn" onclick="openModal('style-settings')">
    <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="2.5"/><path d="M7 1v2M7 11v2M1 7h2M11 7h2M2.9 2.9l1.4 1.4M9.7 9.7l1.4 1.4M9.7 4.3L11.1 2.9M2.9 11.1l1.4-1.4"/></svg>
    Styles
  </button>
  <div class="tsep"></div>
  <button class="tbtn" onclick="toggleCP('manchester')">
    <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="3.5 4.5 1 7 3.5 9.5"/><polyline points="10.5 4.5 13 7 10.5 9.5"/><line x1="8" y1="2" x2="6" y2="12"/></svg>
    Export / Query
  </button>
  <button class="tbtn" onclick="showImport()">
    <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 1v7M4 5l3 3 3-3"/><path d="M2 10h10v2H2z"/></svg>
    Import
  </button>
  <button class="tbtn" onclick="clearAll()" style="color:var(--red)">
    <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 3h12M5 3V1h4v2M4 3l.5 9h5l.5-9"/></svg>
    Clear
  </button>
</div>

<!-- LEFT SIDEBAR -->
<div id="sl">
  <div class="sh">
    <span class="stitle">Ontology Tree</span>
    <span id="onto-nm" style="font-size:11px;color:var(--acc);font-weight:600">Untitled</span>
  </div>
  <div class="sb" id="tree"></div>
  <div class="statsbar">
    <div class="si"><div class="sv" id="sc">0</div><div class="sl2">Classes</div></div>
    <div class="si"><div class="sv" id="sp">0</div><div class="sl2">Props</div></div>
    <div class="si"><div class="sv" id="si2">0</div><div class="sl2">Inds</div></div>
    <div class="si"><div class="sv" id="se">0</div><div class="sl2">Axioms</div></div>
  </div>
</div>

<!-- CANVAS -->
<div id="ca">
  <div id="cy"></div>
  
  <div class="hud hud-tl">
    <button class="hb" onclick="cy.zoom(cy.zoom()*1.25)" title="Zoom in"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="6" r="4.5"/><line x1="10" y1="10" x2="13" y2="13"/><line x1="4" y1="6" x2="8" y2="6"/><line x1="6" y1="4" x2="6" y2="8"/></svg></button>
    <button class="hb" onclick="cy.zoom(cy.zoom()*.8)" title="Zoom out"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="6" r="4.5"/><line x1="10" y1="10" x2="13" y2="13"/><line x1="4" y1="6" x2="8" y2="6"/></svg></button>
    <button class="hb" onclick="cy.fit(null,40)" title="Fit all"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 5V2h3M9 2h3v3M12 9v3H9M5 12H2V9"/></svg></button>
  </div>

  <!-- HUD top-right for Filters/Highlighting toggles -->
  <div class="hud hud-tr">
    <button class="hb" id="toggle-orphans-btn" onclick="toggleOrphans()" title="Toggle Orphan Nodes" style="width:auto; padding:0 8px; font-size:11px; gap:5px; display:flex; align-items:center;">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" style="width:12px;height:12px;"><circle cx="7" cy="7" r="2"/><circle cx="2" cy="2" r="1"/><circle cx="12" cy="12" r="1"/></svg>
      <span>Show Orphans</span>
    </button>
    <button class="hb" id="toggle-highlight-btn" onclick="toggleHighlightMode()" title="Highlight Connections on Selection" style="width:auto; padding:0 8px; font-size:11px; gap:5px; display:flex; align-items:center;">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" style="width:12px;height:12px;"><circle cx="3" cy="3" r="1.5"/><circle cx="11" cy="11" r="1.5"/><circle cx="7" cy="7" r="2"/><line x1="4.2" y1="4.2" x2="5.8" y2="5.8"/><line x1="8.2" y1="8.2" x2="9.8" y2="9.8"/></svg>
      <span>Highlight Conn</span>
    </button>
  </div>

  <div class="hud hud-bl">
    <div id="selbar" style="display:none; background:var(--bg2); border:1px solid var(--ln); border-radius:var(--r); padding:4px 10px; font-size:11px; color:var(--t1); gap:8px; align-items:center;">
      <span id="sel-lbl" style="font-weight:600; color:var(--t0)"></span>
      <div class="tsep" style="height:14px; width:1px; background:var(--ln); margin:0 4px;"></div>
      <button class="tbtn" id="btn-focus-neigh" onclick="focusNeighbors()" style="padding:3px 8px; font-size:10px; background:var(--bg3); border:1px solid var(--ln2);">Neighbors</button>
      <button class="tbtn" id="btn-focus-conn" onclick="focusConnected()" style="padding:3px 8px; font-size:10px; background:var(--bg3); border:1px solid var(--ln2);">Connections</button>
      <button class="tbtn" id="btn-focus-all" onclick="resetFocus()" style="padding:3px 8px; font-size:10px; background:var(--bg3); border:1px solid var(--ln2);">Show All</button>
      <div class="tsep" style="height:14px; width:1px; background:var(--ln); margin:0 4px;"></div>
      <button class="hb" onclick="deleteSelected()" style="color:var(--red);border-color:rgba(248,113,113,.25); width:24px; height:24px; display:flex; align-items:center; justify-content:center;" title="Delete">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" style="width:12px; height:12px;"><path d="M1 3h12M4 3V1h6v2M3 3l.5 9h7l.5-9"/></svg>
      </button>
    </div>
  </div>
  <div id="cp">
    <div id="cp-head">
      <span style="font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t2);margin-right:4px">Format</span>
      <span class="ctab active" id="ct-m" onclick="switchCT('manchester')">Manchester OWL</span>
      <span class="ctab" id="ct-r" onclick="switchCT('rdfxml')">RDF/XML</span>
      <span class="ctab" id="ct-t" onclick="switchCT('turtle')">Turtle</span>
      <span class="ctab" id="ct-q" onclick="switchCT('sparql')">SPARQL Query</span>
      <div style="flex:1"></div>
      <button class="btn btn-g" style="font-size:11px;padding:3px 9px" onclick="copyCode()">Copy</button>
      <button class="btn btn-g" style="font-size:11px;padding:3px 9px" onclick="dlCode()">Download</button>
      <button class="btn btn-g" style="font-size:11px;padding:3px 9px;margin-left:4px" onclick="closeCP()">✕</button>
    </div>
    <textarea id="cp-ta" readonly spellcheck="false"></textarea>
    <div id="sparql-container" style="display:none; flex:1; flex-direction:row; height:calc(100% - 34px); overflow:hidden;">
      <div style="width:45%; display:flex; flex-direction:column; border-right:1px solid var(--ln); padding:8px 12px; gap:8px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:10px; font-weight:700; text-transform:uppercase; color:var(--t2)">SPARQL Query</span>
          <button class="btn btn-p" style="font-size:11px; padding:3px 9px;" onclick="executeSPARQL()">Run Query</button>
        </div>
        <textarea id="sparql-query-input" class="fi mono" style="flex:1; resize:none; background:var(--bg2); color:var(--t0); border:1px solid var(--ln); line-height: 1.5;" spellcheck="false"></textarea>
      </div>
      <div style="width:55%; display:flex; flex-direction:column; padding:8px 12px; gap:8px; overflow:hidden;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:10px; font-weight:700; text-transform:uppercase; color:var(--t2)">Results</span>
          <button class="btn btn-g" id="sparql-select-all-btn" style="font-size:11px; padding:3px 9px; display:none;" onclick="selectAllSPARQLMatches()">Select All Matches</button>
        </div>
        <div id="sparql-results" style="flex:1; overflow-y:auto; background:var(--bg2); border:1px solid var(--ln); border-radius:var(--r); padding:4px;">
          <div style="color:var(--t2); font-style:italic; padding:8px; font-size:11px;">Execute a query to see results here...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- RIGHT SIDEBAR -->
<div id="sr">
  <div class="itabs">
    <div class="itab active" id="it-d" onclick="switchIT('d')">Details</div>
    <div class="itab" id="it-a" onclick="switchIT('a')">Axioms</div>
    <div class="itab" id="it-s" onclick="switchIT('s')">Style</div>
    <div class="itab" id="it-n" onclick="switchIT('n')">Annotations</div>
  </div>
  <div class="ib" id="inspbody"></div>
</div>

</div><!-- #app -->

<!-- MODAL -->
<div id="mo"><div class="modal" id="modal">
  <h2 id="mtitle"></h2>
  <div id="mbody"></div>
  <div class="macts">
    <button class="btn btn-g" onclick="closeModal()">Cancel</button>
    <button class="btn btn-p" id="mok" onclick="modalOK()">Add</button>
  </div>
</div></div>

<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════
   GLOBAL STATE
═══════════════════════════════════════════════ */

function buildCyStyle(){
  return [
    { selector:'node', style:{
        'shape':'data(shape)',
        'width':'data(w)',
        'height':'data(h)',
        'background-color':'data(fill)',
        'border-color':'data(stroke)',
        'border-width':1.5,
        'label':'data(label)',
        'color':'data(textColor)',
        'font-family':'"DM Sans",sans-serif',
        'font-size':'data(fs)',
        'font-weight':500,
        'text-valign':'center',
        'text-halign':'center',
        'text-wrap':'wrap',
        'text-max-width':'data(tw)',
        'text-overflow-wrap':'anywhere',
        'min-zoomed-font-size':6,
        'transition-property': 'background-color, border-color, opacity',
        'transition-duration': '0.18s'
    }},
    { selector:'node:selected', style:{
        'border-width':2.5,
        'border-color':'#ffffff',
        'overlay-opacity':0.06,
    }},
    { selector:'edge', style:{
        'width':1.5,
        'line-color':'data(ec)',
        'target-arrow-color':'data(ec)',
        'target-arrow-shape':'triangle',
        'curve-style':'bezier',
        'label':'data(label)',
        'font-size':9,
        'color':'#5e6680',
        'text-background-color':'#0b0d12',
        'text-background-opacity':1,
        'text-background-padding':'3px',
        'font-family':'"DM Sans",sans-serif',
        'edge-text-rotation':'autorotate',
        'min-zoomed-font-size':6,
        'transition-property': 'line-color, target-arrow-color, width, opacity',
        'transition-duration': '0.18s'
    }},
    { selector:'edge[dashed]', style:{'line-style':'dashed','line-dash-pattern':[6,3]}},
    { selector:'edge:selected', style:{'line-color':'#ffffff','target-arrow-color':'#ffffff','overlay-opacity':0.08}},
    { selector:'.hidden-element', style:{'display':'none'}},
    { selector:'.orphan-hidden', style:{'display':'none'}},
    
    // Dimmed state for connections highlighting
    { selector:'node.dimmed', style:{'opacity':0.15, 'events':'no'}},
    { selector:'edge.dimmed', style:{'opacity':0.15, 'events':'no'}},
    { selector:'node.highlighted-node', style:{'border-width':3.5, 'border-color':'#ffffff'}},
    { selector:'edge.highlighted-edge', style:{'width':3, 'line-color':'#ffffff', 'target-arrow-color':'#ffffff'}},
  ];
}

// Compute node dimensions from label length + type size
function nodeDims(label, type){
  const cfg = typeStyles[type] || typeStyles.class;
  const baseSize = cfg.size;
  const chars = (label||'').length;
  // Scale width up for longer names, height stays fixed for short, grows for wrapped
  const minW = baseSize;
  const perChar = 7.5; // ~7.5px per char at 12px DM Sans
  const labW = chars * perChar + 28; // padding
  const w = Math.max(minW, labW);
  // If label wraps, increase height
  const wrapCols = Math.floor(w / 8);
  const lines = Math.ceil(chars / Math.max(wrapCols, 1));
  const h = Math.max(cfg.shape === 'ellipse' ? 48 : 40, lines * 18 + 16);
  const tw = w - 16; // text-max-width
  const fs = chars > 18 ? 11 : 12;
  return { w: Math.round(w), h: Math.round(h), tw: Math.round(tw), fs };
}

/* ═══════════════════════════════════════════════
   NODE / EDGE MANAGEMENT
═══════════════════════════════════════════════ */
function addNode(type, name, parent){
  const id = type+'__'+name.replace(/\W+/g,'_')+'__'+Date.now();
  const cfg = typeStyles[type] || typeStyles.class;
  const dims = nodeDims(name, type);
  cy.add({ group:'nodes', data:{
    id, label:name, type,
    shape: cfg.shape, fill: cfg.fill, stroke: cfg.stroke, textColor: cfg.textColor,
    iri: baseIRI+name, annotations:{},
    ...dims,
  }, position:{ x: 200+Math.random()*350, y: 150+Math.random()*220 }});
  if(parent) addEdgeDirect('subClassOf', parent, id);
  refreshTree(); updateStats();
  toast(`Added ${type}: ${name}`);
  return id;
}

function addEdgeDirect(relType, src, tgt){
  const id = `e__${relType}__${src}__${tgt}__${Date.now()}`;
  const isDashed = ['equivalentClass','disjointWith'].includes(relType);
  cy.add({ group:'edges', data:{
    id, source:src, target:tgt,
    label:relType, relType,
    ec: EDGE_COLORS[relType] || EDGE_COLORS.relation,
    ...(isDashed ? {dashed:true} : {}),
  }});
  updateStats();
  return id;
}

function addEdgeSafe(relType, src, tgt){
  if(!src||!tgt||src===tgt) return;
  const ex = cy.edges().filter(e=>e.data('source')===src&&e.data('target')===tgt&&e.data('relType')===relType);
  if(ex.length) return;
  addEdgeDirect(relType, src, tgt);
}

function deleteSelected(){

  selEl.remove(); selEl=null;
  emptyInsp();

  refreshTree(); updateStats();
  toast(`Deleted: ${lbl}`);
}

function clearAll(){

  cy.elements().remove(); selEl=null;

  refreshTree(); updateStats(); toast('Cleared');
}

function modalOK(){
  const a = pendingAction;
  if(!a) return;

  if(a.type==='style-settings'){ closeModal(); return; }

  if(a.type==='relation'){
    let rt = document.getElementById('mrt').value;
    const src = document.getElementById('msrc').value;
    const tgt = document.getElementById('mtgt').value;
    if(src===tgt){ toast('Source and target must differ'); return; }
    if(rt==='relation') rt = document.getElementById('mcrv').value.trim()||'relatedTo';
    addEdgeDirect(rt, src, tgt);
    closeModal(); return;
  }

  if(a.type==='import'){
    const fmt = document.getElementById('ifmt').value;
    const txt = document.getElementById('itxt').value.trim();
    if(!txt){ toast('No text'); return; }
    try{ importOntology(fmt,txt); closeModal(); }
    catch(e){ toast('Parse error: '+e.message); }
    return;
  }

  const name = (document.getElementById('mn').value||'').trim();
  if(!name){ toast('Name required'); return; }
  const rl = (document.getElementById('mrl')?.value||'').trim();
  const rc = (document.getElementById('mrc')?.value||'').trim();
  const par = document.getElementById('mpar')?.value||null;
  const inst = document.getElementById('minst')?.value||null;
  const id = addNode(a.type, name, par||null);
  const node = cy.getElementById(id);
  if(rl) node.data('rdfsLabel',rl);
  if(rc) node.data('comment',rc);
  if(inst) addEdgeDirect('type', id, inst);
  closeModal();
}
function closeModal(){
  document.getElementById('mo').classList.remove('open');
  pendingAction=null;
}
document.getElementById('mo').addEventListener('click', e=>{ if(e.target===document.getElementById('mo')) closeModal(); });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeModal();
  if((e.key==='Delete'||e.key==='Backspace')&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) deleteSelected();
  if(e.key==='Enter'&&document.getElementById('mo').classList.contains('open')){ e.preventDefault(); modalOK(); }
});

function buildStyleSettings(){
  const typeLabels={ class:'Class', property:'Object Property', dataprop:'Data Property', individual:'Individual', annprop:'Annotation Property' };
  return Object.entries(typeStyles).map(([type,cfg])=>`
  <div style="margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--ln)">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <div style="width:9px;height:9px;border-radius:50%;background:${cfg.stroke};flex-shrink:0"></div>
      <strong style="font-size:12px">${typeLabels[type]}</strong>
    </div>
    <div class="fl" style="margin-bottom:4px">Shape</div>
    <div class="shape-grid" id="sg-${type}">
      ${SHAPES.map(s=>`<div class="shape-opt ${cfg.shape===s.id?'active':''}" data-type="${type}" data-shape="${s.id}" onclick="pickShape('${type}','${s.id}',this)">
        ${shapeIconSVG(s.id)}
        <span>${s.label}</span>
      </div>`).join('')}
    </div>
    <div class="fl" style="margin-top:10px;margin-bottom:4px">Color</div>
    <div class="color-row" id="cr-${type}">
      ${PALETTE.map(p=>`<div class="co ${cfg.stroke===p.c?'active':''}" style="background:${p.c}" data-stroke="${p.c}" data-fill="${p.bg}" title="${p.c}" onclick="pickColor('${type}',this,'${p.c}','${p.bg}')"></div>`).join('')}
    </div>
    <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
      <label class="fl" style="margin-bottom:0;flex-shrink:0">Base size</label>
      <input type="range" min="70" max="200" value="${cfg.size}" style="flex:1" oninput="document.getElementById('sz-${type}').textContent=this.value;typeStyles['${type}'].size=+this.value;refreshAllNodes()" id="szr-${type}">
      <span id="sz-${type}" style="font-size:11px;color:var(--t1);min-width:28px">${cfg.size}</span>
    </div>
  </div>`).join('');
}

function shapeIconSVG(shape){
  const s={
    ellipse:`<ellipse cx="11" cy="11" rx="9" ry="6" fill="none" stroke="currentColor" stroke-width="1.3"/>`,
    'round-rectangle':`<rect x="2" y="6" width="18" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"/>`,
    rectangle:`<rect x="2" y="6" width="18" height="10" fill="none" stroke="currentColor" stroke-width="1.3"/>`,
    diamond:`<polygon points="11,2 20,11 11,20 2,11" fill="none" stroke="currentColor" stroke-width="1.3"/>`,
    hexagon:`<polygon points="11,2 19,6.5 19,15.5 11,20 3,15.5 3,6.5" fill="none" stroke="currentColor" stroke-width="1.3"/>`,
    pentagon:`<polygon points="11,2 20,8.5 16.5,19 5.5,19 2,8.5" fill="none" stroke="currentColor" stroke-width="1.3"/>`,
    triangle:`<polygon points="11,2 21,20 1,20" fill="none" stroke="currentColor" stroke-width="1.3"/>`,
    barrel:`<rect x="3" y="5" width="16" height="12" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/><line x1="3" y1="11" x2="19" y2="11" stroke="currentColor" stroke-width=".7"/>`,
  };
  return `<svg viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">${s[shape]||s.rectangle}</svg>`;
}

function pickShape(type, shape, el){
  typeStyles[type].shape = shape;
  document.querySelectorAll(`#sg-${type} .shape-opt`).forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  refreshTypeNodes(type);
}

function pickColor(type, el, stroke, fill){
  typeStyles[type].stroke = stroke;
  typeStyles[type].fill = fill;
  // derive text color: lighten stroke
  typeStyles[type].textColor = lightenHex(stroke, 0.35);
  document.querySelectorAll(`#cr-${type} .co`).forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  refreshTypeNodes(type);
}

function lightenHex(hex, amount){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  const lr=Math.min(255,r+Math.round((255-r)*amount));
  const lg=Math.min(255,g+Math.round((255-g)*amount));
  const lb=Math.min(255,b+Math.round((255-b)*amount));
  return '#'+[lr,lg,lb].map(x=>x.toString(16).padStart(2,'0')).join('');
}

function refreshTypeNodes(type){
  const cfg = typeStyles[type];
  cy.nodes().filter(n=>n.data('type')===type).forEach(n=>{
    const dims = nodeDims(n.data('label'), type);
    n.data('shape', cfg.shape);
    n.data('fill', cfg.fill);
    n.data('stroke', cfg.stroke);
    n.data('textColor', cfg.textColor);
    n.data('w', dims.w); n.data('h', dims.h);
    n.data('tw', dims.tw); n.data('fs', dims.fs);
  });
}

function refreshAllNodes(){
  Object.keys(typeStyles).forEach(refreshTypeNodes);
}

function focusNeighbors(){
  if(!selEl || !selEl.isNode()) return;
  cy.elements().addClass('hidden-element');
  selEl.closedNeighborhood().removeClass('hidden-element');
}

function focusConnected(){
  if(!selEl || !selEl.isNode()) return;
  const allEles = cy.elements();
  const components = allEles.components();
  const comp = components.find(c => c.contains(selEl));
  if(comp){
    allEles.addClass('hidden-element');
    comp.removeClass('hidden-element');
  }
}

function resetFocus(){
  cy.elements().removeClass('hidden-element');
}

function toggleOrphans() {
  hideOrphans = !hideOrphans;
  const btn = document.getElementById('toggle-orphans-btn');
  btn.classList.toggle('active', hideOrphans);
  btn.querySelector('span').textContent = hideOrphans ? "Hide Orphans" : "Show Orphans";
  applyOrphansFilter();
}

function applyOrphansFilter() {
  if (hideOrphans) {
    cy.nodes().forEach(n => {
      if (n.connectedEdges().length === 0) {
        n.addClass('orphan-hidden');
      } else {
        n.removeClass('orphan-hidden');
      }
    });
  } else {
    cy.nodes().removeClass('orphan-hidden');
  }
}

function toggleHighlightMode() {
  highlightConnectionsMode = !highlightConnectionsMode;
  const btn = document.getElementById('toggle-highlight-btn');
  btn.classList.toggle('active', highlightConnectionsMode);
  applyHighlighting();
}

function applyHighlighting() {
  if (!highlightConnectionsMode) {
    cy.elements().removeClass('dimmed').removeClass('highlighted-edge').removeClass('highlighted-node');
    return;
  }
  const selected = cy.$(':selected');
  if (selected.length === 0) {
    cy.elements().removeClass('dimmed').removeClass('highlighted-edge').removeClass('highlighted-node');
    return;
  }
  
  cy.elements().addClass('dimmed').removeClass('highlighted-edge').removeClass('highlighted-node');
  
  selected.forEach(ele => {
    ele.removeClass('dimmed');
    if (ele.isNode()) {
      ele.closedNeighborhood().removeClass('dimmed');
      ele.connectedEdges().addClass('highlighted-edge').removeClass('dimmed');
      ele.neighborhood().addClass('highlighted-node').removeClass('dimmed');
    } else {
      ele.source().removeClass('dimmed');
      ele.target().removeClass('dimmed');
      ele.addClass('highlighted-edge').removeClass('dimmed');
    }
  });
}

/* ═══════════════════════════════════════════════
   SPARQL ENGINE
═══════════════════════════════════════════════ */
function getOntologyTriples() {
  const triples = [];
  const nodes = cy.nodes();
  const edges = cy.edges();

  nodes.forEach(n => {
    const label = n.data('label');
    const type = n.data('type');
    const s = `:${label}`;

    let rdfType = 'owl:Class';
    if (type === 'property') rdfType = 'owl:ObjectProperty';
    else if (type === 'dataprop') rdfType = 'owl:DatatypeProperty';
    else if (type === 'annprop') rdfType = 'owl:AnnotationProperty';
    else if (type === 'individual') rdfType = 'owl:NamedIndividual';
    triples.push({ s, p: 'rdf:type', o: rdfType, elementId: n.id() });

    if (n.data('rdfsLabel')) {
      triples.push({ s, p: 'rdfs:label', o: `"${n.data('rdfsLabel')}"`, elementId: n.id() });
    }
    if (n.data('comment')) {
      triples.push({ s, p: 'rdfs:comment', o: `"${n.data('comment')}"`, elementId: n.id() });
    }
  });

  edges.forEach(e => {
    const sourceLabel = cy.getElementById(e.data('source')).data('label');
    const targetLabel = cy.getElementById(e.data('target')).data('label');
    const relType = e.data('relType') || e.data('label');

    let p = `:${relType}`;
    if (['subClassOf', 'equivalentClass', 'disjointWith', 'subPropertyOf', 'domain', 'range'].includes(relType)) {
      p = `rdfs:${relType}`;
      if (['equivalentClass', 'disjointWith'].includes(relType)) {
        p = `owl:${relType}`;
      }
    } else if (relType === 'type') {
      p = 'rdf:type';
    }

    triples.push({
      s: `:${sourceLabel}`,
      p: p,
      o: `:${targetLabel}`,
      elementId: e.id()
    });
  });

  return triples;
}

function runSPARQL(queryText) {
  const cleanQuery = queryText
    .split('\n')
    .filter(line => !line.trim().toLowerCase().startsWith('prefix'))
    .join('\n')
    .replace(/#.*$/gm, '')
    .replace(/\s+/g, ' ')
    .trim();

  const selectMatch = cleanQuery.match(/SELECT\s+([\s\S]+?)\s+WHERE/i);
  if (!selectMatch) throw new Error("Missing SELECT clause");
  const selectVars = selectMatch[1].trim().split(/\s+/).map(v => v.trim());

  const whereMatch = cleanQuery.match(/WHERE\s*\{([\s\S]+?)\}/i);
  if (!whereMatch) throw new Error("Missing WHERE clause block");
  const whereBody = whereMatch[1].trim();

  const patterns = [];
  const rawPatterns = whereBody.split(/\.(?=(?:[^"]|"[^"]*")*$)/);
  rawPatterns.forEach(pat => {
    const parts = pat.trim().match(/(?:[^\s"]+|"[^"]*")+/g);
    if (parts && parts.length >= 3) {
      patterns.push({
        s: parts[0],
        p: parts[1],
        o: parts[2]
      });
    }
  });

  const db = getOntologyTriples();
  const results = [];

  function matchPattern(patternIdx, env, matchedIds) {
    if (patternIdx === patterns.length) {
      const resultRow = {};
      selectVars.forEach(v => {
        resultRow[v] = env[v] !== undefined ? env[v] : '';
      });
      resultRow._elementIds = Array.from(matchedIds);
      results.push(resultRow);
      return;
    }

    const pat = patterns[patternIdx];
    const sVal = pat.s.startsWith('?') ? env[pat.s] : pat.s;
    const pVal = pat.p.startsWith('?') ? env[pat.p] : pat.p;
    const oVal = pat.o.startsWith('?') ? env[pat.o] : pat.o;

    for (const triple of db) {
      const newEnv = { ...env };

      if (pat.s.startsWith('?')) {
        if (sVal !== undefined && sVal !== triple.s) continue;
        newEnv[pat.s] = triple.s;
      } else {
        if (pat.s !== triple.s) continue;
      }

      if (pat.p.startsWith('?')) {
        if (pVal !== undefined && pVal !== triple.p) continue;
        newEnv[pat.p] = triple.p;
      } else {
        if (pat.p !== triple.p) continue;
      }

      if (pat.o.startsWith('?')) {
        if (oVal !== undefined && oVal !== triple.o) continue;
        newEnv[pat.o] = triple.o;
      } else {
        if (pat.o !== triple.o) continue;
      }

      const nextMatched = new Set(matchedIds);
      if (triple.elementId) {
        nextMatched.add(triple.elementId);
      }

      matchPattern(patternIdx + 1, newEnv, nextMatched);
    }
  }

  matchPattern(0, {}, new Set());

  const uniqueResults = [];
  const seen = new Set();
  results.forEach(row => {
    const temp = { ...row };
    delete temp._elementIds;
    const str = JSON.stringify(temp);
    if (!seen.has(str)) {
      seen.add(str);
      uniqueResults.push(row);
    }
  });

  return { vars: selectVars, rows: uniqueResults };
}

function executeSPARQL() {
  const qi = document.getElementById('sparql-query-input').value;
  const resDiv = document.getElementById('sparql-results');
  const selectAllBtn = document.getElementById('sparql-select-all-btn');

  try {
    const res = runSPARQL(qi);
    lastSparqlResults = res;

    if (res.rows.length === 0) {
      resDiv.innerHTML = `<div style="color:var(--t2); font-style:italic; padding:8px; font-size:11px;">No matches found.</div>`;
      selectAllBtn.style.display = 'none';
      return;
    }

    selectAllBtn.style.display = 'inline-block';

    let html = `<table style="width:100%; border-collapse:collapse; font-family:var(--mono); font-size:11px; color:var(--t0);">`;
    html += `<tr style="border-bottom:1px solid var(--ln2); background:var(--bg3); color:var(--t1);"><th style="padding:6px; text-align:left;">#</th>`;
    res.vars.forEach(v => {
      html += `<th style="padding:6px; text-align:left;">${v}</th>`;
    });
    html += `</tr>`;

    res.rows.forEach((row, idx) => {
      const rowBg = idx % 2 === 0 ? 'transparent' : 'var(--bg3)';
      html += `<tr onclick="selectSPARQLRow(${idx})" class="sparql-row" style="border-bottom:1px solid var(--ln); background:${rowBg}; cursor:pointer;" title="Click to focus on canvas">`;
      html += `<td style="padding:6px; color:var(--t2);">${idx + 1}</td>`;
      res.vars.forEach(v => {
        html += `<td style="padding:6px; color:var(--acc);">${escAttr(row[v] || '')}</td>`;
      });
      html += `</tr>`;
    });
    html += `</table>`;
    resDiv.innerHTML = html;
  } catch(e) {
    lastSparqlResults = null;
    selectAllBtn.style.display = 'none';
    resDiv.innerHTML = `<div style="color:var(--red); padding:8px; font-family:var(--mono); font-size:11px; white-space:pre-wrap;">Error: ${e.message}</div>`;
  }
}

function selectSPARQLRow(idx) {
  if (!lastSparqlResults || !lastSparqlResults.rows[idx]) return;
  const row = lastSparqlResults.rows[idx];
  cy.elements().unselect();

  const idsToSelect = new Set(row._elementIds || []);

  // Map variables bound to individuals/classes back to their respective nodes
  lastSparqlResults.vars.forEach(v => {
    const val = row[v];
    if (val && val.startsWith(':')) {
      const label = val.slice(1);
      const node = cy.nodes().filter(n => n.data('label') === label);
      if (node.length) idsToSelect.add(node.id());
    }
  });

  const targetElements = cy.elements().filter(el => idsToSelect.has(el.id()));
  if (targetElements.length) {
    targetElements.select();
    cy.animate({ center: { eles: targetElements } }, { duration: 300 });
    toast(`Selected ${targetElements.length} elements from query row`);
  }
}

function selectAllSPARQLMatches() {
  if (!lastSparqlResults || lastSparqlResults.rows.length === 0) return;
  cy.elements().unselect();
  const idsToSelect = new Set();

  lastSparqlResults.rows.forEach(row => {
    (row._elementIds || []).forEach(id => idsToSelect.add(id));
    lastSparqlResults.vars.forEach(v => {
      const val = row[v];
      if (val && val.startsWith(':')) {
        const label = val.slice(1);
        const node = cy.nodes().filter(n => n.data('label') === label);
        if (node.length) idsToSelect.add(node.id());
      }
    });
  });

  const targetElements = cy.elements().filter(el => idsToSelect.has(el.id()));
  if (targetElements.length) {
    targetElements.select();
    cy.fit(targetElements, 60);
    toast(`Selected all matched query elements (${targetElements.length})`);
  } else {
    toast("No elements matched to select");
  }
}

/* ═══════════════════════════════════════════════
   MANCHESTER OWL GENERATION
═══════════════════════════════════════════════ */
function genManchester(){
  const n=cy.nodes(), e=cy.edges();
  let o=`Prefix: owl: <http://www.w3.org/2002/07/owl#>
Prefix: rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
Prefix: rdfs: <http://www.w3.org/2000/01/rdf-schema#>
Prefix: xsd: <http://www.w3.org/2001/XMLSchema#>
Prefix: : <${baseIRI}>

Ontology: <${ontoIRI}>\n\n`;

  n.filter(x=>x.data('type')==='class').forEach(c=>{
    o+=`Class: :${c.data('label')}\n`;
    if(c.data('rdfsLabel')) o+=`    Annotations: rdfs:label "${c.data('rdfsLabel')}"\n`;
    if(c.data('comment'))   o+=`    Annotations: rdfs:comment "${c.data('comment')}"\n`;
    e.filter(x=>x.data('source')===c.id()&&x.data('relType')==='subClassOf')
      .forEach(x=>{ o+=`    SubClassOf: :${cy.getElementById(x.data('target')).data('label')}\n`; });
    const eq=e.filter(x=>(x.data('source')===c.id()||x.data('target')===c.id())&&x.data('relType')==='equivalentClass');
    if(eq.length) o+=`    EquivalentTo: ${eq.map(x=>':'+cy.getElementById(x.data('source')===c.id()?x.data('target'):x.data('source')).data('label')).join(', ')}\n`;
    const dj=e.filter(x=>(x.data('source')===c.id()||x.data('target')===c.id())&&x.data('relType')==='disjointWith');
    if(dj.length) o+=`    DisjointWith: ${dj.map(x=>':'+cy.getElementById(x.data('source')===c.id()?x.data('target'):x.data('source')).data('label')).join(', ')}\n`;
    o+='\n';
  });
  n.filter(p=>p.data('type')==='property').forEach(p=>{
    o+=`ObjectProperty: :${p.data('label')}\n`;
    if(p.data('rdfsLabel')) o+=`    Annotations: rdfs:label "${p.data('rdfsLabel')}"\n`;
    e.filter(x=>x.data('source')===p.id()&&x.data('relType')==='domain')
      .forEach(x=>{ o+=`    Domain: :${cy.getElementById(x.data('target')).data('label')}\n`; });
    e.filter(x=>x.data('source')===p.id()&&x.data('relType')==='range')
      .forEach(x=>{ o+=`    Range: :${cy.getElementById(x.data('target')).data('label')}\n`; });
    o+='\n';
  });
  n.filter(x=>x.data('type')==='dataprop').forEach(p=>{
    o+=`DataProperty: :${p.data('label')}\n`;
    if(p.data('rdfsLabel')) o+=`    Annotations: rdfs:label "${p.data('rdfsLabel')}"\n`;
    o+='\n';
  });
  n.filter(x=>x.data('type')==='annprop').forEach(p=>{
    o+=`AnnotationProperty: :${p.data('label')}\n`;
    if(p.data('rdfsLabel')) o+=`    Annotations: rdfs:label "${p.data('rdfsLabel')}"\n`;
    o+='\n';
  });
  n.filter(x=>x.data('type')==='individual').forEach(i=>{
    o+=`Individual: :${i.data('label')}\n`;
    if(i.data('rdfsLabel')) o+=`    Annotations: rdfs:label "${i.data('rdfsLabel')}"\n`;
    e.filter(x=>x.data('source')===i.id()&&x.data('relType')==='type')
      .forEach(x=>{ o+=`    Types: :${cy.getElementById(x.data('target')).data('label')}\n`; });
    o+='\n';
  });
  return o.trim();
}

function manchesterForNode(node){
  return node.connectedEdges().map(e=>{
    const isS=e.data('source')===node.id();
    const other=isS?e.target():e.source();
    return `<div>${isS?'→':'←'} ${e.data('relType')} :${other.data('label')}</div>`;
  }).join('');
}

/* ═══════════════════════════════════════════════
   RDF/XML GENERATION
═══════════════════════════════════════════════ */
function xe(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function genRDFXML(){
  const n=cy.nodes(), e=cy.edges();
  let x=`<?xml version="1.0"?>
<rdf:RDF
  xml:base="${baseIRI}"
  xmlns:rdfs="http://www.w3.org/2000/01/rdf-schema#"
  xmlns:owl="http://www.w3.org/2002/07/owl#"
  xmlns:xsd="http://www.w3.org/2001/XMLSchema#"
  xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">

  <owl:Ontology rdf:about="${ontoIRI}"/>\n\n`;

  n.filter(c=>c.data('type')==='class').forEach(c=>{
    x+=`  <owl:Class rdf:about="${baseIRI}${c.data('label')}">\n`;
    if(c.data('rdfsLabel')) x+=`    <rdfs:label xml:lang="en">${xe(c.data('rdfsLabel'))}</rdfs:label>\n`;
    if(c.data('comment'))   x+=`    <rdfs:comment xml:lang="en">${xe(c.data('comment'))}</rdfs:comment>\n`;
    e.filter(x2=>x2.data('source')===c.id()&&x2.data('relType')==='subClassOf')
      .forEach(x2=>{ x+=`    <rdfs:subClassOf rdf:resource="${baseIRI}${cy.getElementById(x2.data('target')).data('label')}"/>\n`; });
    e.filter(x2=>(x2.data('source')===c.id()||x2.data('target')===c.id())&&x2.data('relType')==='equivalentClass')
      .forEach(x2=>{ const o=x2.data('source')===c.id()?x2.data('target'):x2.data('source'); x+=`    <owl:equivalentClass rdf:resource="${baseIRI}${cy.getElementById(o).data('label')}"/>\n`; });
    e.filter(x2=>(x2.data('source')===c.id()||x2.data('target')===c.id())&&x2.data('relType')==='disjointWith')
      .forEach(x2=>{ const o=x2.data('source')===c.id()?x2.data('target'):x2.data('source'); x+=`    <owl:disjointWith rdf:resource="${baseIRI}${cy.getElementById(o).data('label')}"/>\n`; });
    x+=`  </owl:Class>\n\n`;
  });
  n.filter(p=>p.data('type')==='property').forEach(p=>{
    x+=`  <owl:ObjectProperty rdf:about="${baseIRI}${p.data('label')}">\n`;
    if(p.data('rdfsLabel')) x+=`    <rdfs:label xml:lang="en">${xe(p.data('rdfsLabel'))}</rdfs:label>\n`;
    e.filter(x2=>x2.data('source')===p.id()&&x2.data('relType')==='domain')
      .forEach(x2=>{ x+=`    <rdfs:domain rdf:resource="${baseIRI}${cy.getElementById(x2.data('target')).data('label')}"/>\n`; });
    e.filter(x2=>x2.data('source')===p.id()&&x2.data('relType')==='range')
      .forEach(x2=>{ x+=`    <rdfs:range rdf:resource="${baseIRI}${cy.getElementById(x2.data('target')).data('label')}"/>\n`; });
    x+=`  </owl:ObjectProperty>\n\n`;
  });
  n.filter(p=>p.data('type')==='dataprop').forEach(p=>{
    x+=`  <owl:DatatypeProperty rdf:about="${baseIRI}${p.data('label')}">\n`;
    if(p.data('rdfsLabel')) x+=`    <rdfs:label xml:lang="en">${xe(p.data('rdfsLabel'))}</rdfs:label>\n`;
    x+=`  </owl:DatatypeProperty>\n\n`;
  });
  n.filter(i=>i.data('type')==='individual').forEach(i=>{
    x+=`  <owl:NamedIndividual rdf:about="${baseIRI}${i.data('label')}">\n`;
    e.filter(x2=>x2.data('source')===i.id()&&x2.data('relType')==='type')
      .forEach(x2=>{ x+=`    <rdf:type rdf:resource="${baseIRI}${cy.getElementById(x2.data('target')).data('label')}"/>\n`; });
    if(i.data('rdfsLabel')) x+=`    <rdfs:label xml:lang="en">${xe(i.data('rdfsLabel'))}</rdfs:label>\n`;
    x+=`  </owl:NamedIndividual>\n\n`;
  });
  x+=`</rdf:RDF>`;
  return x;
}

/* ═══════════════════════════════════════════════
   TURTLE GENERATION
═══════════════════════════════════════════════ */
function genTurtle(){
  const n=cy.nodes(), e=cy.edges();
  let t=`@prefix : <${baseIRI}> .
@prefix owl: <http://www.w3.org/2002/07/owl#> .
@prefix rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .
@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
@prefix xsd: <http://www.w3.org/2001/XMLSchema#> .

<${ontoIRI}> a owl:Ontology .\n\n`;

  n.filter(c=>c.data('type')==='class').forEach(c=>{
    const lines=[];
    if(c.data('rdfsLabel')) lines.push(`    rdfs:label "${c.data('rdfsLabel')}"@en`);
    if(c.data('comment'))   lines.push(`    rdfs:comment "${c.data('comment')}"@en`);
    e.filter(x=>x.data('source')===c.id()&&x.data('relType')==='subClassOf')
      .forEach(x=>{ lines.push(`    rdfs:subClassOf :${cy.getElementById(x.data('target')).data('label')}`); });
    t+=`:${c.data('label')} a owl:Class`;
    t+= lines.length ? ' ;\n'+lines.join(' ;\n')+' .\n\n' : ' .\n\n';
  });
  n.filter(p=>p.data('type')==='property').forEach(p=>{
    const lines=[];
    if(p.data('rdfsLabel')) lines.push(`    rdfs:label "${p.data('rdfsLabel')}"@en`);
    e.filter(x=>x.data('source')===p.id()&&x.data('relType')==='domain').forEach(x=>{ lines.push(`    rdfs:domain :${cy.getElementById(x.data('target')).data('label')}`); });
    e.filter(x=>x.data('source')===p.id()&&x.data('relType')==='range').forEach(x=>{ lines.push(`    rdfs:range :${cy.getElementById(x.data('target')).data('label')}`); });
    t+=`:${p.data('label')} a owl:ObjectProperty`;
    t+= lines.length ? ' ;\n'+lines.join(' ;\n')+' .\n\n' : ' .\n\n';
  });
  n.filter(p=>p.data('type')==='dataprop').forEach(p=>{ t+=`:${p.data('label')} a owl:DatatypeProperty .\n\n`; });
  n.filter(i=>i.data('type')==='individual').forEach(i=>{
    const types=e.filter(x=>x.data('source')===i.id()&&x.data('relType')==='type');
    t+=`:${i.data('label')} a owl:NamedIndividual`;
    types.forEach(x=>{ t+=`, :${cy.getElementById(x.data('target')).data('label')}`; });
    t+=' .\n\n';
  });
  return t.trim();
}

/* ═══════════════════════════════════════════════
   IMPORT
═══════════════════════════════════════════════ */
function importOntology(fmt,text){
  cy.elements().remove();
  resetFocus();
  if(fmt==='manchester') parseManchester(text);
  else if(fmt==='rdfxml') parseRDFXML(text);
  else parseTurtle(text);
  refreshTree(); updateStats();
  setTimeout(runLayout,60);
  toast('Import successful');
}

function addNodeImport(type,name){
  const ex=cy.nodes().filter(n=>n.data('type')===type&&n.data('label')===name);
  if(ex.length) return ex.first().id();
  const id=type+'__'+name.replace(/\W+/g,'_')+'__'+Date.now()+'_'+Math.random().toString(36).slice(2,5);
  const cfg=typeStyles[type]||typeStyles.class;
  const dims=nodeDims(name,type);
  cy.add({ group:'nodes', data:{
    id, label:name, type, shape:cfg.shape, fill:cfg.fill, stroke:cfg.stroke, textColor:cfg.textColor,
    iri:baseIRI+name, annotations:{}, ...dims,
  }, position:{x:200+Math.random()*400,y:100+Math.random()*300}});
  return id;
}

function findNid(name){ const n=cy.nodes().filter(x=>x.data('label')===name); return n.length?n.first().id():null; }
function ensureN(type,name){ if(!findNid(name)) addNodeImport(type,name); }
function sp(s){ return (s||'').replace(/^[a-zA-Z_]*:/,'').replace(/[<>]/g,'').trim(); }
function parseTargets(s){ return s.split(',').map(x=>sp(x.trim())).filter(Boolean); }

function parseManchester(text){
  const lines=text.split('\n');
  let curType=null,curName=null;
  for(const raw of lines){
    const line=raw.trim();
    if(!line||line.startsWith('Prefix:')||line.startsWith('Ontology:')) continue;
    const cm=line.match(/^Class:\s+(\S+)/);
    const om=line.match(/^ObjectProperty:\s+(\S+)/);
    const dm=line.match(/^DataProperty:\s+(\S+)/);
    const am=line.match(/^AnnotationProperty:\s+(\S+)/);
    const im=line.match(/^Individual:\s+(\S+)/);
    if(cm){ curType='class'; curName=sp(cm[1]); addNodeImport('class',curName); continue; }
    if(om){ curType='property'; curName=sp(om[1]); addNodeImport('property',curName); continue; }
    if(dm){ curType='dataprop'; curName=sp(dm[1]); addNodeImport('dataprop',curName); continue; }
    if(am){ curType='annprop'; curName=sp(am[1]); addNodeImport('annprop',curName); continue; }
    if(im){ curType='individual'; curName=sp(im[1]); addNodeImport('individual',curName); continue; }
    if(!curName) continue;
    const srcId=findNid(curName);
    const sc=line.match(/SubClassOf:\s+(.+)/), eq=line.match(/EquivalentTo:\s+(.+)/), dj=line.match(/DisjointWith:\s+(.+)/);
    const ty=line.match(/Types:\s+(.+)/), do_=line.match(/Domain:\s+(.+)/), ra=line.match(/Range:\s+(.+)/);
    const la=line.match(/Annotations:.*rdfs:label\s+"([^"]+)"/), co=line.match(/Annotations:.*rdfs:comment\s+"([^"]+)"/);
    if(sc) parseTargets(sc[1]).forEach(t=>{ ensureN('class',t); addEdgeSafe('subClassOf',srcId,findNid(t)); });
    if(eq) parseTargets(eq[1]).forEach(t=>{ ensureN('class',t); addEdgeSafe('equivalentClass',srcId,findNid(t)); });
    if(dj) parseTargets(dj[1]).forEach(t=>{ ensureN('class',t); addEdgeSafe('disjointWith',srcId,findNid(t)); });
    if(ty) parseTargets(ty[1]).forEach(t=>{ ensureN('class',t); addEdgeSafe('type',srcId,findNid(t)); });
    if(do_) parseTargets(do_[1]).forEach(t=>{ ensureN('class',t); addEdgeSafe('domain',srcId,findNid(t)); });
    if(ra) parseTargets(ra[1]).forEach(t=>{ ensureN('class',t); addEdgeSafe('range',srcId,findNid(t)); });
    if(la){ const n2=cy.getElementById(srcId); if(n2.length) n2.data('rdfsLabel',la[1]); }
    if(co){ const n2=cy.getElementById(srcId); if(n2.length) n2.data('comment',co[1]); }
  }
}

function parseRDFXML(text){
  const doc=new DOMParser().parseFromString(text,'application/xml');
  const ln=uri=>(uri||'').split(/[#/]/).pop();
  doc.querySelectorAll('Class').forEach(el=>{ const n=ln(el.getAttribute('rdf:about')||el.getAttribute('rdf:ID')||''); if(n&&n!=='owl:Class') addNodeImport('class',n); });
  doc.querySelectorAll('ObjectProperty').forEach(el=>{ const n=ln(el.getAttribute('rdf:about')||''); if(n) addNodeImport('property',n); });
  doc.querySelectorAll('DatatypeProperty').forEach(el=>{ const n=ln(el.getAttribute('rdf:about')||''); if(n) addNodeImport('dataprop',n); });
  doc.querySelectorAll('NamedIndividual').forEach(el=>{ const n=ln(el.getAttribute('rdf:about')||''); if(n) addNodeImport('individual',n); });
  doc.querySelectorAll('Class').forEach(el=>{
    const src=ln(el.getAttribute('rdf:about')||el.getAttribute('rdf:ID')||'');
    if(!src) return; const srcId=findNid(src);
    el.querySelectorAll('subClassOf').forEach(x=>{ const t=ln(x.getAttribute('rdf:resource')||''); if(t){ ensureN('class',t); addEdgeSafe('subClassOf',srcId,findNid(t)); }});
    el.querySelectorAll('equivalentClass').forEach(x=>{ const t=ln(x.getAttribute('rdf:resource')||''); if(t){ ensureN('class',t); addEdgeSafe('equivalentClass',srcId,findNid(t)); }});
    el.querySelectorAll('disjointWith').forEach(x=>{ const t=ln(x.getAttribute('rdf:resource')||''); if(t){ ensureN('class',t); addEdgeSafe('disjointWith',srcId,findNid(t)); }});
  });
  doc.querySelectorAll('ObjectProperty').forEach(el=>{
    const src=ln(el.getAttribute('rdf:about')||''); if(!src) return; const srcId=findNid(src);
    el.querySelectorAll('domain').forEach(x=>{ const t=ln(x.getAttribute('rdf:resource')||''); if(t){ ensureN('class',t); addEdgeSafe('domain',srcId,findNid(t)); }});
    el.querySelectorAll('range').forEach(x=>{ const t=ln(x.getAttribute('rdf:resource')||''); if(t){ ensureN('class',t); addEdgeSafe('range',srcId,findNid(t)); }});
  });
  doc.querySelectorAll('NamedIndividual').forEach(el=>{
    const src=ln(el.getAttribute('rdf:about')||''); if(!src) return; const srcId=findNid(src);
    el.querySelectorAll('type').forEach(x=>{ const t=ln(x.getAttribute('rdf:resource')||''); if(t&&t!=='NamedIndividual'){ ensureN('class',t); addEdgeSafe('type',srcId,findNid(t)); }});
  });
}

function parseTurtle(text){
  const lines=text.split('\n').filter(l=>!l.trim().startsWith('@')&&!l.trim().startsWith('#')&&l.trim());
  const stmts=lines.join(' ').split(/\.\s+/);
  const triples=[];
  stmts.forEach(stmt=>{
    const p=stmt.trim().split(/\s+/);
    if(p.length>=3){ const s=sp(p[0]),pr=p[1],o=sp(p.slice(2).join(' ').replace(/[;,]/g,'').trim()); if(s&&o) triples.push([s,pr,o]); }
  });
  triples.forEach(([s,p,o])=>{
    if(p==='a'||p==='rdf:type'){
      if(o==='owl:Class') addNodeImport('class',s);
      else if(o==='owl:ObjectProperty') addNodeImport('property',s);
      else if(o==='owl:DatatypeProperty') addNodeImport('dataprop',s);
      else if(o==='owl:NamedIndividual') addNodeImport('individual',s);
    }
  });
  triples.forEach(([s,p,o])=>{
    if(p==='rdfs:subClassOf'){ ensureN('class',s); ensureN('class',o); addEdgeSafe('subClassOf',findNid(s),findNid(o)); }
  });
}

/* ═══════════════════════════════════════════════
   IRI
═══════════════════════════════════════════════ */
function setIRI(){
  const v=prompt('Base IRI (ending with # or /):', baseIRI);
  if(!v) return;
  baseIRI=v.trim();
  if(!baseIRI.endsWith('#')&&!baseIRI.endsWith('/')) baseIRI+='#';
  ontoIRI=baseIRI.replace(/#$/,'').replace(/\/$/,'');
  document.getElementById('iri-disp').textContent=baseIRI;
  const lbl=prompt('Ontology name:', ontoLabel);
  if(lbl){ ontoLabel=lbl; document.getElementById('onto-nm').textContent=lbl; }
}

/* ═══════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════ */
let toastT;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2100);
}
